<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foundkeep — Capture</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="collections.css" />
  </head>
  <body>
    <div id="view-main" class="popup-view">
      <header class="popup-head">
        <a class="brand" href="#" id="brandLibrary" aria-label="Open Foundkeep library">
          <img src="../assets/mark.svg" alt="" /><span data-product-name>Foundkeep</span>
        </a>
        <span class="storage" id="storageState"><i></i>Saved locally</span>
      </header>

      <main class="popup-main">
        <div id="cloudSummary"></div>
        <section class="capture-section" aria-labelledby="captureHeading">
          <div class="current-page">
            <span class="page-icon" data-icon="bookmark"></span>
            <div><span id="page-domain">Current page</span><p id="page-title">Choose what to keep.</p></div>
          </div>
          <h1 id="captureHeading">Keep this page</h1>
          <button id="savePage" class="save-page-action" data-act="savepage" data-feature="bookmark" type="button">
            <span class="action-icon" data-icon="bookmark"></span>
            <span class="action-copy"><strong class="action-label">Save page</strong><small>Readable copy, key details, and its original source</small></span>
            <span class="action-arrow" data-icon="arrow"></span>
          </button>
          <div id="secondaryActions" class="capture-actions" role="group" aria-label="Other ways to capture">
            <button data-act="highlight" data-feature="highlight" type="button"><span data-icon="highlight"></span><span class="action-label">Highlight</span></button>
            <button data-act="region" data-feature="region" type="button"><span data-icon="screenshot"></span><span class="action-label">Region</span></button>
            <button data-act="fullpage" data-feature="fullPage" type="button"><span data-icon="image"></span><span class="action-label">Full page</span></button>
          </div>
          <p id="captureFeedback" class="capture-feedback" role="status">You can also right-click text, links, or images.</p>
        </section>

        <section id="noteComposer" class="composer" aria-labelledby="noteLabel">
          <div class="composer-heading"><label id="noteLabel" for="note">Add a note</label><span>Optional</span></div>
          <textarea id="note" rows="2" maxlength="50000" placeholder="What should you remember?"></textarea>
          <div class="composer-foot">
            <span class="fine">⌘ / Ctrl + Enter</span>
            <button id="save" class="btn primary" disabled type="button">Save note <span data-icon="arrow"></span></button>
          </div>
          <p id="saveFeedback" class="statusline" role="status"></p>
        </section>

        <div id="popup-collections"></div>

        <section id="recentSection" class="recent-section" aria-labelledby="recentHeading">
          <div class="section-heading"><h2 id="recentHeading">Recently saved</h2><span id="savedCount"></span></div>
          <ul id="recent"></ul>
        </section>
      </main>

      <footer class="popup-foot">
        <div class="library-actions">
          <button id="openLib" class="library-link" type="button">Open library <span data-icon="arrow"></span></button>
          <button id="openLocalLib" class="cloud-text-button" type="button" hidden>Local copy</button>
        </div>
        <button id="openSettings" class="iconbtn" type="button" aria-label="Account and settings"><span data-icon="settings"></span></button>
      </footer>
    </div>

    <div id="view-settings" class="popup-view" hidden>
      <header class="popup-head settings-head">
        <button id="backBtn" class="iconbtn" type="button" aria-label="Back to capture"><span class="back-arrow" data-icon="arrow"></span></button>
        <div><span class="eyebrow">Foundkeep</span><h2>Account &amp; settings</h2></div>
      </header>
      <div class="settings-panel">
        <div id="connections"></div>
        <button id="openPreferenceDashboard" class="btn secondary dashboard-settings" type="button">Customize capture settings <span data-icon="arrow"></span></button>
        <p class="fine settings-note">Capture controls sync with your Foundkeep account across connected browsers.</p>
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>

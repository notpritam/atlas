<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #3b82f6;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0b0f19; --fg: #e5e7eb; --muted: #9ca3af; --border: #1f2937; }
      }
      * { box-sizing: border-box; }
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
      h1 { font-size: 14px; margin: 0; letter-spacing: -0.01em; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
      .dot.ok { background: #16a34a; }
      .dot.bad { background: #dc2626; }
      textarea {
        width: 100%; height: 74px; resize: vertical; padding: 8px;
        border: 1px solid var(--border); border-radius: 8px;
        background: transparent; color: inherit; font: inherit;
      }
      button {
        border: 0; border-radius: 8px; padding: 7px 12px; font: inherit; font-weight: 600;
        background: var(--accent); color: #fff; cursor: pointer;
      }
      button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: 500; }
      .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
      .grow { flex: 1; }
      input {
        width: 100%; padding: 7px 8px; border: 1px solid var(--border); border-radius: 8px;
        background: transparent; color: inherit; font: inherit;
      }
      label { display: block; color: var(--muted); font-size: 11px; margin: 8px 0 3px; text-transform: uppercase; letter-spacing: 0.04em; }
      details { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 8px; }
      summary { cursor: pointer; color: var(--muted); font-size: 12px; }
      .status { margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 16px; }
      .hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Atlas Capture</h1>
      <span><span id="dot" class="dot"></span> <span id="conn" style="font-size:11px;color:var(--muted)">…</span></span>
    </header>

    <textarea id="note" placeholder="Quick note…&#10;Saved to Atlas, the agent tags it for you."></textarea>
    <div class="row">
      <button id="save" class="grow">Save note</button>
    </div>
    <div id="status" class="status"></div>

    <details id="settings">
      <summary>Settings</summary>
      <label>Backend URL</label>
      <input id="baseUrl" placeholder="https://atlas.notpritam.in" />
      <label>Device token</label>
      <input id="token" type="password" placeholder="paste the ingest token" />
      <div class="row">
        <button id="saveSettings" class="secondary grow">Save & test</button>
      </div>
      <div class="hint">The token is stored locally and only sent to your backend.</div>
    </details>

    <script type="module" src="popup.js"></script>
  </body>
</html>

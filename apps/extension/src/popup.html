<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="view-main">
      <header class="topbar">
        <div class="brand"><img src="../icons/icon32.png" width="22" height="22" alt="" /> <span>Atlas</span></div>
        <button id="statusChip" class="status" title="Agent status"><span id="dot" class="dot"></span><span id="conn">…</span></button>
      </header>

      <div class="composer">
        <textarea id="note" rows="3" placeholder="Capture a thought…"></textarea>
        <div class="composer-foot">
          <span class="hint">⌘/Ctrl + Enter</span>
          <button id="save" class="btn btn-primary">Save note</button>
        </div>
      </div>

      <div class="section-label">Clip this page</div>
      <div class="actions">
        <button class="action" data-act="region"><span class="a-ic ic-shot"></span><span>Region</span></button>
        <button class="action" data-act="fullpage"><span class="a-ic ic-page"></span><span>Full page</span></button>
        <button class="action" data-act="highlight"><span class="a-ic ic-highlight"></span><span>Highlight</span></button>
        <button class="action" data-act="savepage"><span class="a-ic ic-bookmark"></span><span>Bookmark</span></button>
      </div>

      <div class="section-label">Recent</div>
      <ul id="recent" class="recent"></ul>

      <footer class="footer">
        <button id="openLib" class="btn btn-primary lib">Open Library</button>
        <button id="openSettings" class="iconbtn" aria-label="Settings"><span class="a-ic ic-gear"></span></button>
      </footer>
    </div>

    <div id="view-settings" hidden>
      <header class="topbar">
        <button id="backBtn" class="iconbtn" aria-label="Back"><span class="a-ic ic-back"></span></button>
        <div class="brand"><span>Settings</span></div>
        <span style="width:30px"></span>
      </header>
      <div class="settings">
        <label>Atlas Agent URL <span class="muted">(enrichment)</span></label>
        <input id="agentUrl" placeholder="http://127.0.0.1:8791" />
        <label class="row"><input id="enrichEnabled" type="checkbox" /> <span>Enrich captures with Claude Code</span></label>

        <label>Agent control relay <span class="muted">(optional)</span></label>
        <input id="relayUrl" placeholder="wss://atlas.notpritam.in/agent" />
        <input id="relayToken" type="password" placeholder="account token" />
        <div class="agentbox" id="relayBox"></div>

        <button id="saveSettings" class="btn btn-primary full">Save &amp; test</button>
        <p class="fineprint">
          Captures + enrichment stay on your machine. The <b>relay</b> is separate —
          set the URL + your account token to let your agent drive this browser from
          anywhere (the agent uses the same token). Leave blank for local-only.
        </p>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>

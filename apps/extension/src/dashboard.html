<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Atlas — Library</title>
    <link rel="icon" href="../assets/mark.svg" />
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="#"><img src="../assets/mark.svg" width="26" height="26" alt="" /> <span>Atlas</span></a>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" placeholder="Search everything you've saved…" autocomplete="off" />
      </div>
      <button id="statusChip" class="status" title="Agent status"><span id="dot" class="dot"></span><span id="conn">…</span></button>
      <button id="settingsBtn" class="iconbtn" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9.4A1.7 1.7 0 0 0 10.5 3a2 2 0 1 1 4 0a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9z"/></svg>
      </button>
    </header>

    <div class="filterbar">
      <div id="typeFilters" class="chips"></div>
      <div id="facetFilters" class="chips facets"></div>
    </div>

    <main class="wrap">
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty" hidden></div>
    </main>

    <!-- detail overlay -->
    <div id="overlay" class="overlay" hidden>
      <div class="sheet" id="sheet"></div>
    </div>

    <!-- settings modal -->
    <div id="settings" class="overlay" hidden>
      <div class="modal">
        <div class="modal-head"><h2>Settings</h2><button id="settingsClose" class="iconbtn sm" aria-label="Close">✕</button></div>
        <div class="modal-body">
          <label>Atlas Agent URL</label>
          <input id="agentUrl" placeholder="http://127.0.0.1:8791" />
          <label class="row"><input id="enrichEnabled" type="checkbox" /> <span>Enrich captures with Claude Code</span></label>
          <div class="agentbox" id="agentBox"></div>
          <p class="hint">Everything is stored locally in this browser — nothing is sent to a server. Enrichment runs on your own machine via the Atlas Agent + your Claude Code.</p>
          <div class="modal-actions">
            <button id="saveSettings" class="btn btn-primary">Save &amp; test</button>
            <button id="drainNow" class="btn btn-secondary">Enrich now</button>
            <span class="spacer"></span>
            <button id="exportBtn" class="btn btn-ghost">Export</button>
            <button id="clearBtn" class="btn btn-ghost danger">Clear all</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="dashboard.js"></script>
  </body>
</html>

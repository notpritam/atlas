<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoundKeep link styles</title><style>*{box-sizing:border-box}body{margin:0;padding:22px;background:#fafafa;color:#202020;font:14px/1.5 system-ui,sans-serif}main{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:900px;margin:auto}button{appearance:none;text-align:left;padding:20px;background:#fff;border:1px solid #e3e3e3;border-radius:16px;color:inherit;cursor:pointer;font:inherit}button[aria-pressed=true]{border-color:#0d7a50;background:#f3f8f5}small{display:block;color:#686868;font-size:11px;margin-bottom:20px}.example{display:flex;align-items:center;gap:8px;font-size:16px}.example svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.circle{display:grid;place-items:center;border:1px solid #d3d3d3;border-radius:50%;width:27px;height:27px}.circle svg{width:15px;height:15px}p{font-size:12px;color:#686868;text-align:center;margin:18px 0 0}@media(max-width:540px){main{grid-template-columns:1fr}small{margin-bottom:12px}}</style><main><button aria-pressed="true"><small>A · Small arrow · current choice</small><span class="example">Read the original <svg viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></svg></span></button><button aria-pressed="false"><small>B · Box and arrow</small><span class="example">Read the original <svg viewBox="0 0 24 24"><path d="M14 4h6v6m0-6L10 14M10 4H4v16h16v-6"/></svg></span></button><button aria-pressed="false"><small>C · Arrow in a circle</small><span class="example">Read the original <span class="circle"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></svg></span></span></button></main><p>Click to compare. Tell me A, B, or C to choose your site’s link style.</p><script>document.querySelectorAll('button').forEach(button=>button.onclick=()=>document.querySelectorAll('button').forEach(other=>other.setAttribute('aria-pressed',String(other===button))));</script></html>

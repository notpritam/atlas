function render(){frame.srcdoc=template.replaceAll('__STYLE__',style).replaceAll('__SIGNED__',String(signed));document.querySelectorAll('[data-style]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.style===style)));document.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.device===width)));document.querySelector('#identity').setAttribute('aria-pressed',String(signed));document.querySelector('#description').innerHTML=style==='drawer'?'<strong>More room, clearer hierarchy.</strong> A right-side drawer with roomy navigation and a stable account action at the bottom. The same pattern works on mobile and tablets.':'<strong>Compact and close to the header.</strong> A floating panel keeps more of the landing page in sight. Better for a short menu; less room if navigation grows.';fit();}

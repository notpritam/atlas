:root{font-family:Geist,sans-serif;color:#233235;background:white;font-size:14px;--blue:#086ca8;--muted:#627074;--line:#e5e9e8;--soft:#f3f5f4;--sidebar:286px}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#cdd5d4 transparent}body{margin:0}button,input,textarea{font:inherit}button,a,input,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer;color:inherit;border:0;background:transparent}button,a{touch-action:manipulation}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}::selection{background:#dceef9;color:#143f54}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.app{display:flex;min-height:100dvh}.sidebar{width:var(--sidebar);flex-shrink:0;height:100dvh;position:sticky;top:0;background:white;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px 14px;z-index:3}
.brand-row{display:flex;align-items:center;gap:8px;min-height:48px;margin:0 4px 17px}.brand{display:flex;align-items:center;gap:10px;font:500 18px Clarity,sans-serif;letter-spacing:-.35px;min-width:0;min-height:48px;padding:0;border-radius:8px}.brand img{width:32px;height:32px;flex-shrink:0}.brand>span{white-space:nowrap}.icon-button{display:grid;place-items:center;width:48px;height:48px;flex-shrink:0;border-radius:10px}.icon-button:hover{background:#f0f4f3}.brand-row>.collapse-button{margin-left:auto;color:#6b7b7d}.collapse-button svg{width:19px;height:19px}.secondary-action{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--blue);color:white;min-height:46px;border-radius:9px;margin:0 8px;font-size:12px;font-weight:500}.secondary-action:hover{background:#075888}.secondary-action svg{width:18px;height:18px}

const titles={library:'My library',collections:'Collections',agents:'Agent connections',devices:'Apps & devices',plans:'Plans & usage',settings:'Settings',support:'Support',privacy:'Privacy & data','design-inspiration':'Design inspiration','agent-toolkit':'Agent toolkit','weekend-reads':'Weekend reads'};
const routeData={collections:[['folder','Design inspiration','Private · 24 saves'],['globe','Agent toolkit','Public · 18 saves'],['folder','Weekend reads','Private · 12 saves']],agents:[['agents','Your agent connections','Connect your own agent with scoped, revocable access.']],devices:[['devices','Browser extension','Save good finds while you browse.'],['devices','iPhone app','Capture from the iOS Share menu.']],plans:[['library','Free','Your library, collections, and your own agents.'],['chart','Pro','Optional, consented image understanding and summaries.']],settings:[['settings','Account','Manage your profile and sign-in methods.'],['library','Capture','Choose how your browser saves.'],['agents','Processing','Control optional managed processing.']],support:[['help','FoundKeep support','Get help with your library and connected devices.']],privacy:[['shield','Your privacy and data','Review export and account controls in Settings.']]};
function renderPage(){const title=titles[current]||current;document.querySelector('#breadcrumb-page').textContent=title;document.querySelectorAll('[data-go]').forEach(el=>{const active=el.dataset.go===current||(el.dataset.go==='collections'&&['design-inspiration','agent-toolkit','weekend-reads'].includes(current));if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});const collection=['design-inspiration','agent-toolkit','weekend-reads'].includes(current);const gallery=current==='library'||collection;document.querySelector('#main-content').innerHTML='<div class="page-heading"><h1 tabindex="-1">'+title+'</h1>'+(gallery?'<button class="new-note" data-new-note>'+svg('plus')+'New note</button>':'')+'</div><p class="page-intro">'+(gallery?'A home for your next good find.':'An example destination for trying the sidebar.')+'</p>'+(gallery?'<label class="search">'+svg('search')+'<span class="sr-only">Search sample saves</span><input type="search" placeholder="Search your saves…" value="'+escapeText(query)+'"></label><div class="filters" aria-label="Capture type">'+['All saves','Links','Notes','Images'].map(x=>'<button class="filter" data-filter="'+x+'" aria-pressed="'+(filter===x)+'">'+x+'</button>').join('')+'<span class="sort">Recently saved</span></div><div id="card-results">'+cards()+'</div>':'<div class="route-sample">'+(routeData[current]||[]).map(([icon,heading,copy])=>'<div class="route-row">'+svg(icon)+'<div>'+heading+'<small>'+copy+'</small></div></div>').join('')+'<p class="route-note">This is an interactive design concept using sample content. Your live account, collections, and settings are unchanged.</p><button class="back-library" data-go="library">Back to my library</button></div>');const search=document.querySelector('input[type=search]');if(search)search.oninput=()=>{query=search.value;document.querySelector('#card-results').innerHTML=cards()}}

function closePopups(){document.querySelectorAll('.popup').forEach(x=>x.hidden=true);document.querySelector('.account-button').setAttribute('aria-expanded','false')}
function toggleAccount(){const menu=document.querySelector('#account-menu');const open=menu.hidden;closePopups();menu.hidden=!open;document.querySelector('.account-button').setAttribute('aria-expanded',String(open));if(open)menu.querySelector('button,a').focus()}
const sidebar=document.querySelector('.sidebar'),content=document.querySelector('.content'),sidebarLogo=document.querySelector('#sidebar-logo'),collapseButton=document.querySelector('.collapse-button'),mobileOpenButton=document.querySelector('#mobile-sidebar-open');
let drawerTrigger=mobileOpenButton;
const mobile=()=>matchMedia('(max-width:700px)').matches;
function updateLogo(){const collapsed=document.body.classList.contains('collapsed');sidebarLogo.setAttribute('aria-label',collapsed?'FoundKeep — expand sidebar':'FoundKeep — My library');sidebarLogo.title=collapsed?'Expand sidebar':'My library';if(collapsed){sidebarLogo.setAttribute('aria-controls','sidebar');sidebarLogo.setAttribute('aria-expanded','false')}else{sidebarLogo.removeAttribute('aria-controls');sidebarLogo.removeAttribute('aria-expanded')}collapseButton.setAttribute('aria-label',mobile()?'Collapse navigation':'Collapse sidebar');collapseButton.title=mobile()?'Collapse navigation':'Collapse sidebar'}
function openDrawer(trigger=mobileOpenButton){drawerTrigger=trigger;closePopups();document.body.classList.remove('collapsed');document.body.classList.add('drawer-open');sidebar.inert=false;sidebar.setAttribute('role','dialog');sidebar.setAttribute('aria-modal','true');content.inert=true;mobileOpenButton.setAttribute('aria-expanded','true');document.body.style.overflow='hidden';updateLogo();collapseButton.focus()}
function closeDrawer(restore=true){document.body.classList.remove('drawer-open');sidebar.removeAttribute('role');sidebar.removeAttribute('aria-modal');content.inert=false;mobileOpenButton.setAttribute('aria-expanded','false');document.body.style.overflow='';sidebar.inert=mobile();if(restore)drawerTrigger.focus()}
function expandSidebar(){document.body.classList.remove('collapsed');updateLogo();sidebarLogo.focus()}
function collapseSidebar(){closePopups();if(mobile()){closeDrawer();return}document.body.classList.add('collapsed');updateLogo();sidebarLogo.focus()}
function syncSize(){closeDrawer(false);closePopups();document.body.classList.remove('collapsed');updateLogo()}
function navigate(key){current=key;filter='All saves';query='';closePopups();renderPage();if(document.body.classList.contains('drawer-open')){closeDrawer(false);document.querySelector('h1').focus()}}

function newNote(){if(document.body.classList.contains('drawer-open'))closeDrawer(false);closePopups();document.querySelector('#main-content').innerHTML='<h1>New note</h1><p class="page-intro">Try a note in this preview. It stays in this session only.</p><div class="note-editor" role="form" aria-label="Sample note"><label class="sr-only" for="note-title">Title</label><input id="note-title" name="title" placeholder="Give your thought a title" required maxlength="100"><label class="sr-only" for="note-body">Note</label><textarea id="note-body" name="body" placeholder="Something worth keeping…" required maxlength="2000"></textarea><div class="note-actions"><button type="button" class="save-note">Save sample note</button><button type="button" class="back-library" data-go="library">Cancel</button></div></div>';document.querySelector('#note-title').focus();document.querySelector('.save-note').onclick=()=>{const title=document.querySelector('#note-title'),body=document.querySelector('#note-body');if(!title.reportValidity()||!body.reportValidity())return;saved.unshift({title:title.value,text:body.value,source:'Sample note',type:'Notes',tag:'personal'});navigate('library');notify('Sample note saved in this preview only.')}}

document.addEventListener('click',e=>{
 const go=e.target.closest('[data-go]');if(go){e.preventDefault();navigate(go.dataset.go);return}
 if(e.target.closest('#mobile-sidebar-open')){openDrawer(mobileOpenButton);return}
 if(e.target.closest('#sidebar-logo')){if(document.body.classList.contains('collapsed'))expandSidebar();else navigate('library');return}
 if(e.target.closest('.collapse-button')){collapseSidebar();return}
 if(e.target.closest('.backdrop')){closeDrawer();return}
 if(e.target.closest('[data-new-note]')){newNote();return}
 const filterButton=e.target.closest('[data-filter]');if(filterButton){filter=filterButton.dataset.filter;renderPage();document.querySelector('[data-filter="'+filter+'"]').focus();return}
 if(e.target.closest('.account-button')){toggleAccount();return}
 if(!e.target.closest('.popup'))closePopups();
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){
  if(!document.querySelector('#account-menu').hidden){closePopups();document.querySelector('.account-button').focus();e.preventDefault();return}
  if(document.body.classList.contains('drawer-open')){closeDrawer();e.preventDefault()}
 }
 if(e.key==='Tab'&&document.body.classList.contains('drawer-open')){
  const focusables=[...sidebar.querySelectorAll('button,a,summary')].filter(x=>x.getClientRects().length&&!x.closest('[hidden]'));
  const first=focusables[0],last=focusables.at(-1);
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
 }
});
matchMedia('(max-width:700px)').addEventListener('change',syncSize);renderPage();syncSize();

</script></body></html>

name: Release extension

# Verify extension changes on main. Publishing the production .crx and update
# manifest requires an explicit manual dispatch; a merge must not promote dev
# work to installed production clients through the stable release URLs.
on:
  push:
    branches: [main]
    paths:
      - "apps/extension/**"
      - "deploy/release-extension.mjs"
      - ".github/workflows/release-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # secrets can't be used in `if:` directly — surface it as an env flag
    env:
      HAS_KEY: ${{ secrets.EXTENSION_PEM != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Require the existing extension signing key
        if: github.event_name == 'workflow_dispatch' && env.HAS_KEY != 'true'
        run: |
          echo "The EXTENSION_PEM secret is required to publish Foundkeep updates."
          exit 1

      - name: Install Chromium for browser checks
        run: bunx playwright-core install --with-deps chromium

      - name: Install bounded customer OCR and media runtimes
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng util-linux ffmpeg

      - name: Verify backend and browser flows
        run: |
          # Expo's native fingerprint regression hashes the project eight times.
          bun test --timeout 120000
          bun run test:extension
          bun run test:web
          bun run test:customer

      - name: Read extension version
        id: v
        run: echo "version=$(node -p "require('./apps/extension/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build signed crx + update manifest
        if: github.event_name == 'workflow_dispatch' && env.HAS_KEY == 'true'
        env:
          EXTENSION_PEM_B64: ${{ secrets.EXTENSION_PEM }}
        run: |
          node deploy/release-extension.mjs --no-bump
          node deploy/verify-release.mjs

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ext-v${{ steps.v.outputs.version }}
          name: Foundkeep extension v${{ steps.v.outputs.version }}
          body: |
            Foundkeep 1.6 saves readable page copies with their original source and gives customers direct control over capture methods, popup layout, sync, OCR, summaries and tags from the dashboard.

            Get started at https://foundkeep.app/signup and follow the browser setup in your dashboard.

            - Chrome update manifest: `updates.xml`
            - Signed Foundkeep extension: `foundkeep-extension.crx`
            - Compatibility CRX for installed clients: `atlas-extension.crx`
            - Foundkeep unpacked bundle: `foundkeep-extension.zip`
            - Compatibility unpacked bundle: `atlas-extension.zip`

            Existing local captures stay local until you choose to import them. The unpacked ZIP supports Chrome, Edge, Brave, Opera and Vivaldi on desktop. Chrome Web Store publication is pending; the signed build supports existing managed Chrome installations.
          files: |
            apps/web/ext/atlas-extension.crx
            apps/web/ext/foundkeep-extension.crx
            apps/web/updates.xml
            apps/web/atlas-extension.zip
            apps/web/foundkeep-extension.zip
